[workspace]
authors = ["Brookhaven National Laboratory"]
channels = ["conda-forge"]
name = "bluesky-widgets"
platforms = ["linux-64"]

[tasks]
lint = "pre-commit run --all-files"

[dependencies]
python = "<3.15"
pip = "*"

[pypi-dependencies]
bluesky-widgets = { path = ".", editable = true, extras = ["dev"] }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"


[environments]
py311 = { features = ["py311"] }
py312 = { features = ["py312"] }
py313 = { features = ["py313"] }
py314 = { features = ["py314"] }
