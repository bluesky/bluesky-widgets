name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
      - cron: '00 4 * * *'  # daily at 4AM

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      DISPLAY: ":0"  # arbitrary

    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo
        ports:
        - 27017:27017

    strategy:
      matrix:
        python-env: ["py311", "py312", "py313", "py314"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
      with:
        # Need this to get version number from last tag
        fetch-depth: 0

    # Borrowed from napari CI
    - name: Install Linux libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libegl1
        sudo /usr/bin/Xvfb $DISPLAY -screen 0 1280x1024x24 &

    - name: Start Kafka and Zookeeper for (some) tests
      run: docker compose -f continuous_integration/scripts/docker-compose-kafka.yml up -d

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        environments: ${{ matrix.python-env }}

    - name: Install dependencies
      run: |
        pixi install --environment=${{ matrix.python-env }}
        pixi list --environment=${{ matrix.python-env }}

    - name: Test with pytest
      run: |
        pixi run --environment=${{ matrix.python-env }} coverage run -m pytest -vv
        pixi run --environment=${{ matrix.python-env }} coverage report -m
